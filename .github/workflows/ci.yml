name: Daily Job Scraper

on:
  schedule:
    # 06:00 UTC = 08:00 Norwegian Summer Time (CEST)
    - cron: "0 6 * * *"
  push:
    branches: [main, master]
  workflow_dispatch:

# 1. Grant write permission so GitHub Actions can commit back to the repo
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLA_DISCORD_WEBHOOK_URL: ${{ secrets.OLA_DISCORD_WEBHOOK_URL }}
          PETER_DISCORD_WEBHOOK_URL: ${{ secrets.PETER_DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      # Commit and push any modified files (databases, logs, state, etc.)
      - name: Commit updated databases and files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: auto-update databases and state [skip ci]" && git push)
